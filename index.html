<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>👻 IRL Gjemsel</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2b7"/>
  <meta name="description" content="Et AR-basert spøkelsesspill hvor du finner og fanger spøkelser i virkeligheten"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="IRL Gjemsel"/>
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" type="image/png" href="./icons/icon-192x192.png"/>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0f14;
      color: #eef2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .title {
      font-size: 2.4rem;
      margin: 0 0 4px;
    }
    .subtitle {
      color: #9aa5b1;
      margin: 0 0 36px;
      font-size: 1rem;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }
    .choice {
      display: block;
      background: #161c24;
      border: 1px solid #2a3341;
      border-radius: 14px;
      padding: 18px 20px;
      text-align: left;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .choice:active {
      transform: scale(0.98);
    }
    .choice:hover {
      border-color: #2b7a53;
    }
    .choice-label {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .choice-desc {
      font-size: 0.9rem;
      color: #9aa5b1;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #2b7a53;
      color: #eef2f6;
      border-radius: 999px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }
    .badge.beta {
      background: #7a5a2b;
    }
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #576273;
    }
  </style>
</head>
<body>
  <div class="title">👻 IRL Gjemsel</div>
  <p class="subtitle">Velg spillversjon</p>

  <div class="choices">
    <a class="choice" href="./v1/index.html">
      <span class="badge">Stabil</span>
      <div class="choice-label">Versjon 1</div>
      <div class="choice-desc">Den klassiske utgaven av spillet.</div>
    </a>
    <a class="choice" href="./v2/index.html">
      <span class="badge beta">Ny</span>
      <div class="choice-label">Versjon 2</div>
      <div class="choice-desc">Spøkelseskategorier med varierende vanskelighetsgrad.</div>
    </a>
  </div>

  <footer>Du kan bytte versjon når som helst ved å komme tilbake hit.</footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
